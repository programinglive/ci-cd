# Copy this file to .github/workflows/ci.yml in your project.
# Keep the pinned version: @v1 is the moving major tag.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  ci:
    uses: programinglive/ci-cd/.github/workflows/ci-node.yml@v1
    with:
      build-command: npm run build
